<div class="form-group">
    <label for="amount">Amount (₹)</label>
    <input type="number" id="amount" name="amount"
           class="form-input" placeholder="0.00"
           step="0.01" min="{{ min_amount }}" max="{{ max_amount }}"
           value="{{ form.get('amount', '') }}"
           required autofocus>
</div>

<div class="form-group">
    <label for="{{ choice.name }}">{{ choice.label }}</label>
    <select id="{{ choice.name }}" name="{{ choice.name }}" class="form-input" required>
        <option value="" disabled {% if form.get(choice.name) not in choice.options %}selected{% endif %}>{{ choice.placeholder }}</option>
        {% for option in choice.options %}
        <option value="{{ option }}" {% if form.get(choice.name) == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="date">Date</label>
    <input type="date" id="date" name="date"
           class="form-input"
           value="{{ form.get('date', '') }}"
           required>
</div>

<div class="form-group">
    <label for="description">Description <span class="label-optional">(optional)</span></label>
    <input type="text" id="description" name="description"
           class="form-input" placeholder="What was this for?"
           maxlength="{{ max_description_length }}"
           value="{{ form.get('description', '') }}">
</div>
